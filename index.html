<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tools.isdet.net</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#eeede9;color:#1a1a18;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1rem}
.wrap{max-width:560px;width:100%}
.header{margin-bottom:2rem}
.header h1{font-size:15px;font-weight:500;color:#999990;letter-spacing:.02em}
.header p{font-size:13px;color:#aaa;margin-top:4px}
.tools{display:flex;flex-direction:column;gap:10px}
.tool{display:flex;align-items:center;gap:14px;background:#fff;border:0.5px solid rgba(0,0,0,.10);border-radius:12px;padding:1rem 1.25rem;text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s}
.tool:hover{border-color:rgba(0,0,0,.20);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.tool-icon{width:40px;height:40px;border-radius:10px;background:#FAECE7;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tool-icon i{font-size:20px;color:#D85A30}
.tool-name{font-size:14px;font-weight:500}
.tool-desc{font-size:12px;color:#999990;margin-top:2px}
.tool-arrow{margin-left:auto;color:#ccc;font-size:16px;flex-shrink:0}
@media(prefers-color-scheme:dark){
  body{background:#2e2e2b;color:#e8e8e0}
  .tool{background:#1c1c1a;border-color:rgba(255,255,255,.10)}
  .tool:hover{border-color:rgba(255,255,255,.20)}
  .tool-icon{background:#3d1f13}
  .tool-desc{color:#666660}
  .tool-arrow{color:#444}
  .header h1{color:#666660}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>tools.isdet.net</h1>
    <p>Ferramentas pessoais de produção.</p>
  </div>
  <div class="tools">
    <a href="/apps/custos/" class="tool">
      <div class="tool-icon"><i class="ti ti-chart-bar" aria-hidden="true"></i></div>
      <div>
        <div class="tool-name">Controle de Custos</div>
        <div class="tool-desc">Insumos, sessões de teste e custo por peça — IsdetArt</div>
      </div>
      <i class="ti ti-arrow-right tool-arrow" aria-hidden="true"></i>
    </a>
    <!-- Adicione novas ferramentas aqui seguindo o mesmo padrão -->
  </div>
</div>
</body>
</html>
